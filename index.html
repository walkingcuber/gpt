<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL_TERMINAL_V3.5_STABLE_SYNTH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&display=swap');

        :root {
            --pixel-green: #00ff41;
            --pixel-green-dim: #004411;
            --pixel-green-glow: rgba(0, 255, 65, 0.4);
            --bg-black: #050505;
        }

        body {
            background-color: #000;
            color: var(--pixel-green);
            font-family: 'DotGothic16', 'VT323', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .crt-monitor {
            position: relative;
            width: 100%;
            max-width: 750px;
            background: #0a0a0a;
            border: 15px solid #2a2a2a;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 0 5px #1a1a1a, inset 0 0 100px rgba(0, 255, 65, 0.1);
        }

        .crt-monitor::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 10;
            background-size: 100% 4px, 4px 100%;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline-effect {
            width: 100%;
            height: 100px;
            z-index: 11;
            background: linear-gradient(0deg, rgba(0, 255, 65, 0) 0%, rgba(0, 255, 65, 0.05) 50%, rgba(0, 255, 65, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
        }

        .pixel-text {
            text-shadow: 0 0 10px var(--pixel-green-glow);
            letter-spacing: 2px;
        }

        .btn-pixel {
            background: var(--pixel-green-dim);
            border: 3px solid var(--pixel-green);
            color: var(--pixel-green);
            padding: 8px 16px;
            font-size: 1rem;
            transition: all 0.1s;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--pixel-green);
            position: relative;
        }

        .btn-pixel:hover {
            background: var(--pixel-green);
            color: #000;
            box-shadow: 0px 0px 15px var(--pixel-green);
        }

        .btn-pixel:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--pixel-green);
        }

        .pixel-border {
            border: 2px solid var(--pixel-green);
            background: rgba(0, 255, 65, 0.05);
        }

        .progress-block {
            display: inline-block;
            width: 12px;
            height: 20px;
            margin-right: 2px;
            background: var(--pixel-green-dim);
        }

        .progress-block.active {
            background: var(--pixel-green);
            box-shadow: 0 0 8px var(--pixel-green);
        }

        .cursor {
            width: 10px;
            height: 18px;
            background: var(--pixel-green);
            display: inline-block;
            animation: blink 0.6s steps(1) infinite;
            vertical-align: middle;
        }

        @keyframes blink { 50% { opacity: 0; } }

        input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--pixel-green);
            width: 100%;
            font-family: inherit;
        }

        #ai-quote {
            min-height: 2.5em;
            font-style: italic;
        }

        .bar { width: 3px; background: var(--pixel-green); margin-right: 2px; height: 10px; display: inline-block; }
        .playing .bar { animation: wave 0.5s infinite alternate; }
        @keyframes wave { from { height: 4px; } to { height: 15px; } }
    </style>
</head>
<body>
    <div class="crt-monitor">
        <div class="scanline-effect"></div>
        
        <!-- 頂部資訊欄 -->
        <div class="flex justify-between border-b-2 border-[#00ff41] pb-2 mb-4 pixel-text text-sm">
            <div>
                <p>> SYS_CORE: V3.5_OFFLINE_READY</p>
                <p>> MODE: <span id="status-text">STANDBY</span></p>
            </div>
            <div class="text-right">
                <p id="current-date">DATE: 1999-01-01</p>
                <p>AUDIO: INTERNAL_SYNTH</p>
            </div>
        </div>

        <!-- AI 任務輸入區域 -->
        <div class="mb-4 pixel-border p-3 text-xs">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-white bg-[#00ff41] px-1 text-black font-bold">TASK_INPUT</span>
                <input id="task-input" type="text" placeholder="輸入任務（例如：撰寫代碼）..." maxlength="50">
                <button id="ai-split-btn" class="text-xs border border-[#00ff41] px-2 hover:bg-[#00ff41] hover:text-black transition-colors">✨ AI 拆解</button>
            </div>
            <div id="sub-tasks" class="grid grid-cols-2 gap-x-4 opacity-70">
                <span>[ ] 等待指令序列...</span>
                <span>[ ] 等待指令序列...</span>
            </div>
        </div>

        <!-- 計時器中心 -->
        <div class="text-center my-6">
            <div id="ai-quote" class="text-xs mb-2 opacity-80 px-4">"系統已就緒，所有本地模組載入完畢。"</div>
            <div id="timer-display" class="text-7xl md:text-8xl font-bold pixel-text">25:00</div>
            <div id="timer-label" class="text-lg opacity-60 mt-1 font-bold tracking-widest">--- TASK_UNIT_25 ---</div>
        </div>

        <!-- 音頻視覺化與進度條 -->
        <div class="mb-6">
             <div class="flex justify-between items-center text-xs mb-1">
                <div id="audio-visualizer" class="flex items-end h-4">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
                <div class="flex-grow px-2 truncate opacity-60">SIGNAL: MOZART_SYNTH_01</div>
                <span id="progress-percent">0%</span>
            </div>
            <div id="progress-matrix" class="flex flex-wrap gap-1 justify-center"></div>
        </div>

        <!-- 控制指令 -->
        <div class="flex justify-center gap-8 mb-6">
            <button id="start-btn" class="btn-pixel">RUN</button>
            <button id="reset-btn" class="btn-pixel" style="border-color: #880000; color: #ff0000; box-shadow: 4px 4px 0px #880000;">KILL</button>
        </div>

        <!-- 日誌輸出 -->
        <div class="bg-black p-3 pixel-border h-24 overflow-hidden text-xs opacity-90">
            <div id="logs" class="font-mono">
                <p>> 核心系統啟動成功...</p>
                <p>> 檢測到網路異常，已切換至 100% 本地合成模式 <span class="cursor"></span></p>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; // 自動注入
        const WORK_TIME = 25 * 60;
        const BREAK_TIME = 5 * 60;
        const MATRIX_SIZE = 40; 

        let timeLeft = WORK_TIME;
        let isRunning = false;
        let isWorkSession = true;
        let timerId = null;

        // --- Web Audio 合成器 ---
        let audioCtx = null;
        let isSynthPlaying = false;
        let nextNoteTime = 0;
        let noteIndex = 0;

        const mozartMelody = [
            [440, 0.2], [415, 0.2], [392, 0.2], [415, 0.2], [440, 0.4],
            [493, 0.2], [440, 0.2], [415, 0.2], [440, 0.2], [493, 0.4],
            [523, 0.2], [493, 0.2], [466, 0.2], [493, 0.2], [523, 0.4],
            [587, 0.2], [523, 0.4], [493, 0.4], [440, 0.4]
        ];

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSynthNote(freq, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function synthLoop() {
            if (!isSynthPlaying) return;
            if (audioCtx.currentTime > nextNoteTime) {
                const [freq, duration] = mozartMelody[noteIndex];
                playSynthNote(freq, duration);
                nextNoteTime = audioCtx.currentTime + duration + 0.05;
                noteIndex = (noteIndex + 1) % mozartMelody.length;
            }
            requestAnimationFrame(synthLoop);
        }

        function toggleAudio(force) {
            initAudio();
            isSynthPlaying = (force !== undefined) ? force : !isSynthPlaying;
            const visualizer = document.getElementById('audio-visualizer');
            if (isSynthPlaying) {
                visualizer.classList.add('playing');
                nextNoteTime = audioCtx.currentTime;
                synthLoop();
            } else {
                visualizer.classList.remove('playing');
            }
        }

        // --- Gemini API 邏輯 ---

        async function fetchGemini(prompt, systemInstruction) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('API_FAILURE');
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (err) {
                    if (i === 4) throw err;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }

        async function splitTask() {
            const task = document.getElementById('task-input').value.trim();
            if (!task) return addLog("錯誤：輸入為空。");

            addLog("✨ AI 正在拆解複雜邏輯...");
            const subTasks = document.getElementById('sub-tasks');
            subTasks.innerHTML = '<span>[ ] 解析中...</span>';
            
            try {
                const result = await fetchGemini(`任務：${task}`, "請將任務拆解為4個短步驟（每個10字內）。格式：1.步驟 2.步驟 3.步驟 4.步驟。");
                const steps = result.split(/[1-4]\./).filter(s => s.trim()).slice(0, 4);
                subTasks.innerHTML = '';
                steps.forEach(s => {
                    const el = document.createElement('span');
                    el.textContent = `[ ] ${s.trim()}`;
                    subTasks.appendChild(el);
                });
                addLog("✨ 任務序列已成功重組。");
            } catch (err) {
                addLog("✨ AI 服務連線超時，切換至備用協議。", "error");
                subTasks.innerHTML = '<span>[ ] 手動執行序列 A</span><span>[ ] 手動執行序列 B</span>';
            }
        }

        async function updateQuote() {
            try {
                const quote = await fetchGemini("隨機生成一句駭客風格專注語錄", "你是終端機，生成一句20字內激勵語。例如：'專注是唯一的防火牆。'");
                document.getElementById('ai-quote').textContent = `"${quote.trim()}"`;
            } catch (err) {
                document.getElementById('ai-quote').textContent = '"專注是你的最強代碼。"';
            }
        }

        // --- 介面控制 ---

        function addLog(msg, type = "") {
            const p = document.createElement('p');
            if (type === "error") p.style.color = "#ff4141";
            p.textContent = `> ${msg}`;
            const logs = document.getElementById('logs');
            logs.appendChild(p);
            if (logs.children.length > 5) logs.removeChild(logs.firstChild);
        }

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const secs = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').textContent = `${mins}:${secs}`;

            const total = isWorkSession ? WORK_TIME : BREAK_TIME;
            const progress = (total - timeLeft) / total;
            document.getElementById('progress-percent').textContent = `${Math.floor(progress * 100)}%`;

            const blocks = document.querySelectorAll('.progress-block');
            const activeCount = Math.floor(progress * MATRIX_SIZE);
            blocks.forEach((b, i) => b.classList.toggle('active', i < activeCount));
        }

        function toggleTimer() {
            const btn = document.getElementById('start-btn');
            const status = document.getElementById('status-text');
            
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                btn.textContent = 'RUN';
                status.textContent = 'PAUSED';
                addLog("核心暫停。");
                toggleAudio(false);
            } else {
                isRunning = true;
                btn.textContent = 'STOP';
                status.textContent = isWorkSession ? 'EXECUTING' : 'RECOVERY';
                addLog(isWorkSession ? "執行專注序列..." : "執行修眠程序...");
                toggleAudio(true);
                updateQuote();

                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        isRunning = false;
                        isWorkSession = !isWorkSession;
                        timeLeft = isWorkSession ? WORK_TIME : BREAK_TIME;
                        document.getElementById('timer-label').textContent = isWorkSession ? '--- TASK_UNIT_25 ---' : '--- REST_UNIT_05 ---';
                        toggleTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            isWorkSession = true;
            timeLeft = WORK_TIME;
            document.getElementById('start-btn').textContent = 'RUN';
            document.getElementById('status-text').textContent = 'STANDBY';
            addLog("核心重置完成。");
            toggleAudio(false);
            updateDisplay();
        }

        // 初始化
        const matrix = document.getElementById('progress-matrix');
        for (let i = 0; i < MATRIX_SIZE; i++) {
            const b = document.createElement('div');
            b.className = 'progress-block';
            matrix.appendChild(b);
        }

        document.getElementById('ai-split-btn').addEventListener('click', splitTask);
        document.getElementById('start-btn').addEventListener('click', toggleTimer);
        document.getElementById('reset-btn').addEventListener('click', resetTimer);

        setInterval(() => {
            const now = new Date();
            document.getElementById('current-date').textContent = `DATE: ${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')}`;
        }, 1000);

        updateDisplay();
    </script>
</body>
</html>
