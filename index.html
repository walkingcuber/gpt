<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極廢話語錄產生器 🤖</title>
    <style>
        :root {
            --bg: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --text-color: #44475a;
            --accent: #4a90e2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--bg);
            padding: 50px 30px;
            border-radius: 40px;
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: var(--text-color);
            margin-bottom: 40px;
            font-size: 22px;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .quote-box {
            min-height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            padding: 30px;
            background: var(--bg);
            border-radius: 20px;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
        }

        #quote {
            font-size: 1.25rem;
            color: var(--text-color);
            line-height: 1.6;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .btn {
            background-color: var(--bg);
            color: var(--accent);
            border: none;
            padding: 20px 45px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover {
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            transform: translateY(-2px);
        }

        .btn:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 聽君一席話，如聽一席話</h1>
        <div class="quote-box">
            <p id="quote">點擊下方按鈕，開始接收大師級廢話...</p>
        </div>
        <button class="btn" onclick="generateNonsense()">再聽一席話 🔄</button>
    </div>

    <script>
        const nonsenseDb = [
            "我長話短說，但是說來話長。",
            "你要是沒事，就別來煩我；如果你有事，那更別來煩我。",
            "剝開香蕉後，你會發現一個剝了皮的香蕉。",
            "恭喜你被我恭喜了。",
            "誰能想到當我還是個孩子的時候，我只是個孩子。",
            "記是記得住，就是想不起來了。",
            "我上次這麼無語的時候還是再上一次。",
            "我前腳剛走，後腳就跟上了。",
            "沒有對象的人，應該還是單身吧。",
            "你長得真好看，特別是眼睛，一共兩個不多不少。",
            "如果我沒猜錯的話，那我一定是猜對了。",
            "聽君一席話，如聽一席話。",
            "人生沒有過不去的坎，不去過自然沒有坎。",
            "生活給了我一拳，但我出布。",
            "我決定戒酒到我下次喝酒。",
            "三人行，必有三人。",
            "家有一老，如有一老。",
            "薑還是老的老。",
            "只要我沒有道德，就沒人能道德綁架我。",
            "這件衣服如果不買，那我就省了一筆錢。",
            "根據調查，有50%的人口是女性。",
            "今天如果不下雨，通常就是晴天。",
            "人如果喝了水，就不會口渴。",
            "這道菜只要不難吃，通常就還不錯。",
            "只要你能閉嘴，我就聽不到你的聲音。",
            "如果我不努力，我就只能回去繼承億萬家產。",
            "我一般不說廢話，一說就是這句。",
            "凡是每天刷牙的人，通常口腔都比較健康。",
            "人在呼吸的時候，通常是在吸入氧氣。",
            "如果你不懂，我可以再解釋一遍，或者我不解釋。",
            "對我來說，最重要的就是活著。",
            "我喜歡吃飯，因為吃完就不餓了。",
            "只要你把眼睛閉上，你就會看不見。",
            "如果今天是我生日，那我肯定大了一歲。",
            "這個項目如果不虧本，那應該就是賺錢了。",
            "我覺得這本書寫得很好，如果不看的話，就不知道寫得好不好。",
            "我習慣在吃飯的時候把食物放入嘴裡。",
            "這台電腦如果開機了，它就應該是運作的。",
            "如果我不睡覺，那我就醒著。",
            "只要你在我面前，你就不在別處。",
            "我喜歡睡覺，因為醒來的時候我都醒了。",
            "這個水喝起來很像液體。",
            "只要我不買東西，我就不會花錢。",
            "我覺得如果一個人不運動，那他就不運動。",
            "衣服如果髒了，洗一洗就會變乾淨。",
            "只要你跑得快，我就追不上你。",
            "我吃飯的時候習慣用嘴巴。",
            "只要我長得不醜，我就是好看的。",
            "這是個秘密，我只告訴你一個人，所以你千萬不要告訴別人。",
            "如果我有錢，我就去買東西。",
            "錢不是萬能，但沒有錢萬萬不能。",
            "要與時俱進，緊跟時代發展潮流。",
            "我不能不成功，我一定要做到。",
            "任用很重要。",
            "這個問題，我們需要具體問題具體分析。",
            "我們來梳理一下這件事的邏輯。",
            "我們需要關注一下這件事的重點。",
            "對於這個方案，我保留意見。",
            "這是個好主意，但我們再看看。",
            "我們需要提高工作效率。",
            "項目進度有點慢，大家加油。",
            "明天開個會討論一下今天的主題。",
            "這個報告的內容，大概就是這樣。",
            "我們需要加強部門間的溝通。",
            "大家辛苦了，今天準時下班（但大家都沒走）。",
            "這個問題的核心，在於它是一個問題。",
            "我們要把簡單的問題複雜化，顯得比較專業。",
            "這個計畫的關鍵，就在於執行力。",
            "只要把這件事做完，就能結束。",
            "時間會證明一切。",
            "只要堅持，一定會看到結果。",
            "失敗是成功之母。",
            "這個問題很複雜，但也很簡單。",
            "大家要提高政治站位。",
            "這是公司規定，大家遵守一下。",
            "我們需要創新，但不能脫離傳統。",
            "這個產品的特色，就是它很有特色。",
            "這件事如果你想做，你就會做。",
            "如果不想做，就會找到理由。",
            "只要你努力，就會有收穫（或沒收穫）。",
            "這個專案的風險在於它有風險。",
            "我們要把握機會。",
            "這個問題需要時間解決。",
            "我認為這件事可以做，也可以不做。",
            "既然來了，就好好做吧。",
            "你的人生你自己負責。",
            "大家要保持平常心。",
            "這個世界是公平的（如果不公平，那就是不公平）。",
            "我們要活在當下。",
            "把每一天都當作最後一天來過。",
            "該吃吃，該喝喝，遇事別往心裡擱。",
            "成事在天，謀事在人。",
            "只要活著，就有希望。",
            "這是歷史的必然。",
            "經濟基礎決定上層建築。",
            "時間不等人。",
            "這是我的看法，僅供參考。",
            "大家對這件事怎麼看？",
            "我覺得這件事有點難，但又有點容易。",
            "你說得對，但我不一定同意。"
        ];

        function generateNonsense() {
            const quoteElem = document.getElementById('quote');
            // 加上淡出效果
            quoteElem.style.opacity = 0;
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * nonsenseDb.length);
                quoteElem.innerText = nonsenseDb[randomIndex];
                quoteElem.style.opacity = 1;
            }, 200);
        }
    </script>
</body>
</html>
