<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL_TERMINAL_V7.0_FULLSCREEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&display=swap');

        :root {
            /* 預設經典綠 */
            --main-color: #00ff41;
            --main-dim: #004411;
            --main-glow: rgba(0, 255, 65, 0.4);
            --bg-black: #050505;
        }

        /* 主題樣式定義 */
        body.theme-green { --main-color: #00ff41; --main-dim: #004411; --main-glow: rgba(0, 255, 65, 0.4); }
        body.theme-red { --main-color: #ff3131; --main-dim: #440000; --main-glow: rgba(255, 49, 49, 0.4); }
        body.theme-blue { --main-color: #31d7ff; --main-dim: #002244; --main-glow: rgba(49, 215, 255, 0.4); }
        body.theme-amber { --main-color: #ffb000; --main-dim: #442e00; --main-glow: rgba(255, 176, 0, 0.4); }

        body {
            background-color: #000;
            color: var(--main-color);
            font-family: 'DotGothic16', 'VT323', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            transition: color 0.3s ease;
        }

        .crt-monitor {
            position: relative;
            width: 100%;
            max-width: 650px;
            background: #0a0a0a;
            border: 15px solid #2a2a2a;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 0 5px #1a1a1a, inset 0 0 100px rgba(0, 0, 0, 0.5);
        }

        /* 全螢幕時的調整 */
        :fullscreen .crt-monitor {
            max-width: 900px;
            border: none;
            box-shadow: none;
        }

        .crt-monitor::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 10;
            background-size: 100% 4px, 4px 100%;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .scanline-effect {
            width: 100%; height: 100px; z-index: 11;
            background: linear-gradient(0deg, transparent 0%, var(--main-glow) 50%, transparent 100%);
            opacity: 0.1; position: absolute; bottom: 100%; animation: scanline 8s linear infinite;
        }

        .pixel-text { text-shadow: 0 0 10px var(--main-glow); letter-spacing: 2px; }

        .btn-pixel {
            background: var(--main-dim); border: 2px solid var(--main-color);
            color: var(--main-color); padding: 8px 16px; transition: all 0.1s;
            cursor: pointer; text-transform: uppercase; box-shadow: 3px 3px 0px var(--main-color);
            position: relative; font-weight: bold;
        }

        .btn-pixel:hover { background: var(--main-color); color: #000; box-shadow: 0px 0px 10px var(--main-color); }
        .btn-pixel:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px var(--main-color); }

        .pixel-border { border: 2px solid var(--main-color); background: rgba(0, 0, 0, 0.3); transition: border-color 0.3s; }

        .progress-block { display: inline-block; width: 14px; height: 24px; margin-right: 3px; background: var(--main-dim); transition: background 0.3s; }
        .progress-block.active { background: var(--main-color); box-shadow: 0 0 8px var(--main-glow); }

        .cursor { width: 12px; height: 20px; background: var(--main-color); display: inline-block; animation: blink 0.6s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        input, select { background: transparent; border: none; outline: none; color: var(--main-color); font-family: inherit; }
        
        /* 設置介面樣式 */
        #settings-overlay {
            display: none;
            position: absolute;
            bottom: 60px;
            right: 40px;
            width: 250px;
            background: #0a0a0a;
            border: 3px solid var(--main-color);
            padding: 15px;
            z-index: 50;
            box-shadow: 0 0 20px #000;
        }

        .theme-dot { width: 20px; height: 20px; border: 1px solid #fff; cursor: pointer; border-radius: 2px; }
    </style>
</head>
<body class="theme-green" id="terminal-body">
    <div class="crt-monitor" id="main-monitor">
        <div class="scanline-effect"></div>
        
        <!-- 頂部狀態 -->
        <div class="flex justify-between border-b-2 border-current pb-2 mb-6 pixel-text text-sm">
            <div>
                <p>> SYSTEM: FULLSCREEN_V7</p>
                <p>> THEME: <span id="theme-name">CLASSIC_GREEN</span></p>
            </div>
            <div class="text-right">
                <p id="current-date">DATE: 2024-03-21</p>
                <p>CLOCK: <span id="current-time">00:00:00</span></p>
            </div>
        </div>

        <!-- 任務輸入 -->
        <div class="mb-6 pixel-border p-3">
            <div class="flex items-center gap-3">
                <span class="text-black bg-[var(--main-color)] px-2 font-bold text-xs">TASK</span>
                <input id="task-input" type="text" placeholder="輸入目標代碼..." maxlength="40" class="text-sm w-full">
            </div>
        </div>

        <!-- 計時器 -->
        <div class="text-center my-8">
            <div id="timer-display" class="text-8xl font-bold pixel-text">25:00</div>
            <div id="timer-label" class="text-sm opacity-60 mt-2 font-bold tracking-[0.4em]">--- WORK_SESSION ---</div>
        </div>

        <!-- 進度條 -->
        <div class="mb-8">
            <div class="flex justify-between items-center text-[10px] mb-2">
                <span>PROGRESS_MATRIX</span>
                <span id="progress-percent">0%</span>
            </div>
            <div id="progress-matrix" class="flex flex-wrap gap-1 justify-center"></div>
        </div>

        <!-- 主控制鈕 -->
        <div class="flex justify-center gap-6 mb-4">
            <button id="start-btn" class="btn-pixel w-28">RUN</button>
            <button id="reset-btn" class="btn-pixel w-28" style="border-color:#666; color:#666; box-shadow:3px 3px 0px #333;">RESET</button>
        </div>

        <!-- 底部裝飾與設置入口 -->
        <div class="flex justify-between items-end mt-4">
            <div class="bg-black p-2 pixel-border h-20 w-2/3 overflow-hidden text-[10px] opacity-80">
                <div id="logs" class="font-mono space-y-0.5 text-xs">
                    <p>> 系統內核 V7.0 已就緒。</p>
                    <p>> 全螢幕模組載入完成。<span class="cursor"></span></p>
                </div>
            </div>
            <button onclick="toggleSettings()" class="btn-pixel text-[10px] py-1 px-2">SETTINGS</button>
        </div>

        <!-- 右下角設置介面 -->
        <div id="settings-overlay" class="pixel-text text-xs">
            <p class="border-b border-current mb-3 pb-1 font-bold">系統核心配置</p>
            
            <div class="mb-4">
                <p class="mb-2">視覺方案：</p>
                <div class="flex gap-3">
                    <div onclick="setTheme('green', 'CLASSIC_GREEN')" class="theme-dot" style="background: #00ff41;" title="Classic Green"></div>
                    <div onclick="setTheme('red', 'ALERT_RED')" class="theme-dot" style="background: #ff3131;" title="Alert Red"></div>
                    <div onclick="setTheme('blue', 'CYBER_BLUE')" class="theme-dot" style="background: #31d7ff;" title="Cyber Blue"></div>
                    <div onclick="setTheme('amber', 'VINTAGE_AMBER')" class="theme-dot" style="background: #ffb000;" title="Vintage Amber"></div>
                </div>
            </div>

            <div class="mb-4 flex gap-2">
                <div class="flex-1">
                    <p class="mb-1">工作 (分):</p>
                    <input id="set-work" type="number" value="25" min="1" max="60" class="border border-current px-1 w-full bg-black">
                </div>
                <div class="flex-1">
                    <p class="mb-1">休息 (分):</p>
                    <input id="set-break" type="number" value="5" min="1" max="30" class="border border-current px-1 w-full bg-black">
                </div>
            </div>

            <div class="mb-4">
                <button onclick="toggleFullscreen()" class="w-full border border-current py-1 hover:bg-[var(--main-color)] hover:text-black transition-colors">切換全螢幕 [F]</button>
            </div>

            <button onclick="applySettings()" class="w-full btn-pixel text-[10px] py-1">套用變更</button>
        </div>
    </div>

    <script>
        let workMins = 25;
        let breakMins = 5;
        let timeLeft = workMins * 60;
        let isRunning = false;
        let isWorkSession = true;
        let timerId = null;
        const MATRIX_SIZE = 30;

        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const timerDisplay = document.getElementById('timer-display');
        const timerLabel = document.getElementById('timer-label');
        const logs = document.getElementById('logs');

        function initMatrix() {
            const matrix = document.getElementById('progress-matrix');
            matrix.innerHTML = '';
            for(let i=0; i<MATRIX_SIZE; i++) {
                const b = document.createElement('div');
                b.className = 'progress-block';
                matrix.appendChild(b);
            }
        }

        function setTheme(theme, name) {
            document.body.className = `theme-${theme}`;
            document.getElementById('theme-name').textContent = name;
            addLog(`視覺調整: ${name}`);
        }

        function toggleSettings() {
            const overlay = document.getElementById('settings-overlay');
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    addLog(`全螢幕失敗: ${err.message}`);
                });
                addLog("啟動全螢幕模式。");
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    addLog("退出全螢幕模式。");
                }
            }
        }

        function applySettings() {
            workMins = parseInt(document.getElementById('set-work').value) || 25;
            breakMins = parseInt(document.getElementById('set-break').value) || 5;
            resetTimer();
            toggleSettings();
            addLog("系統時序參數已重寫。");
        }

        function addLog(msg) {
            const p = document.createElement('p');
            p.textContent = `> ${msg}`;
            logs.appendChild(p);
            if(logs.children.length > 5) logs.removeChild(logs.firstChild);
            logs.scrollTop = logs.scrollHeight;
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;

            const total = (isWorkSession ? workMins : breakMins) * 60;
            const progress = (total - timeLeft) / total;
            document.getElementById('progress-percent').textContent = `${Math.floor(progress * 100)}%`;

            const blocks = document.querySelectorAll('.progress-block');
            const activeCount = Math.floor(progress * MATRIX_SIZE);
            blocks.forEach((b, i) => b.classList.toggle('active', i < activeCount));
        }

        function toggleTimer() {
            if(isRunning) {
                clearInterval(timerId);
                isRunning = false;
                startBtn.textContent = 'RUN';
                addLog("序列暫停。");
            } else {
                isRunning = true;
                startBtn.textContent = 'STOP';
                addLog(isWorkSession ? "執行專注序列..." : "執行恢復程序...");
                
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if(timeLeft <= 0) {
                        clearInterval(timerId);
                        isRunning = false;
                        isWorkSession = !isWorkSession;
                        timeLeft = (isWorkSession ? workMins : breakMins) * 60;
                        timerLabel.textContent = isWorkSession ? '--- WORK_SESSION ---' : '--- BREAK_SESSION ---';
                        addLog(isWorkSession ? "休息結束，返回任務。" : "任務達成，啟動休息。");
                        toggleTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            isWorkSession = true;
            timeLeft = workMins * 60;
            startBtn.textContent = 'RUN';
            timerLabel.textContent = '--- WORK_SESSION ---';
            updateDisplay();
        }

        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);

        setInterval(() => {
            const now = new Date();
            document.getElementById('current-date').textContent = `DATE: ${now.toLocaleDateString()}`;
            document.getElementById('current-time').textContent = now.toLocaleTimeString('en-GB');
        }, 1000);

        initMatrix();
        updateDisplay();
    </script>
</body>
</html>
