<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --text-color: #44475a;
            --accent: #007bff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--bg);
            padding: 50px 30px;
            border-radius: 40px;
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
            text-align: center;
            max-width: 650px;
            width: 100%;
        }

        h1 {
            color: var(--text-color);
            margin-bottom: 40px;
            font-size: 22px;
            letter-spacing: 2px;
            opacity: 0.8;
            text-shadow: 1px 1px 0px var(--shadow-light);
        }

        .quote-box {
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            padding: 35px;
            background: var(--bg);
            border-radius: 25px;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
        }

        #quote {
            font-size: 1.3rem;
            color: var(--text-color);
            line-height: 1.7;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn {
            background-color: var(--bg);
            color: var(--accent);
            border: none;
            padding: 20px 50px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover {
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            transform: translateY(-2px);
            color: #0056b3;
        }

        .btn:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            transform: scale(0.96);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

        <div class="quote-box">

        </div>
        <button class="btn" onclick="generateNonsense()">再聽一席話 🔄</button>
        <div class="footer">聽完了，你就聽完了。</div>
    </div>
