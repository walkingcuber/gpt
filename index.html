<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>公開資訊 AI 摘要系統</title>
  <style>
    body { font-family: Arial; padding: 40px; }
    input { padding: 8px; width: 280px; }
    button { padding: 8px 16px; }
    #result { margin-top: 20px; white-space: pre-line; }
  </style>
</head>
<body>

<h2>公開人物／姓名 AI 摘要</h2>

<input id="name" placeholder="輸入姓名">
<button onclick="analyze()">分析</button>

<div id="result"></div>

<script>
async function analyze() {
  const name = document.getElementById("name").value;
  document.getElementById("result").innerText = "分析中，請稍候…";

  const res = await fetch("https://你的後端網址/api/search", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name })
  });

  const data = await res.json();
  document.getElementById("result").innerText = data.summary;
}
</script>

</body>
</html>
