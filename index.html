<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL_TERMINAL_V3.0_GEMINI_AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&display=swap');

        :root {
            --pixel-green: #00ff41;
            --pixel-green-dim: #004411;
            --pixel-green-glow: rgba(0, 255, 65, 0.4);
            --bg-black: #050505;
        }

        body {
            background-color: #000;
            color: var(--pixel-green);
            font-family: 'DotGothic16', 'VT323', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .crt-monitor {
            position: relative;
            width: 100%;
            max-width: 750px;
            background: #0a0a0a;
            border: 15px solid #2a2a2a;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 0 5px #1a1a1a, inset 0 0 100px rgba(0, 255, 65, 0.1);
        }

        .crt-monitor::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 10;
            background-size: 100% 4px, 4px 100%;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline-effect {
            width: 100%;
            height: 100px;
            z-index: 11;
            background: linear-gradient(0deg, rgba(0, 255, 65, 0) 0%, rgba(0, 255, 65, 0.05) 50%, rgba(0, 255, 65, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
        }

        .pixel-text {
            text-shadow: 0 0 10px var(--pixel-green-glow);
            letter-spacing: 2px;
        }

        .btn-pixel {
            background: var(--pixel-green-dim);
            border: 3px solid var(--pixel-green);
            color: var(--pixel-green);
            padding: 8px 16px;
            font-size: 1rem;
            transition: all 0.1s;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--pixel-green);
            position: relative;
        }

        .btn-pixel:hover {
            background: var(--pixel-green);
            color: #000;
            box-shadow: 0px 0px 15px var(--pixel-green);
        }

        .btn-pixel:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--pixel-green);
        }

        .pixel-border {
            border: 2px solid var(--pixel-green);
            background: rgba(0, 255, 65, 0.05);
        }

        .progress-block {
            display: inline-block;
            width: 12px;
            height: 20px;
            margin-right: 2px;
            background: var(--pixel-green-dim);
        }

        .progress-block.active {
            background: var(--pixel-green);
            box-shadow: 0 0 8px var(--pixel-green);
        }

        .cursor {
            width: 10px;
            height: 18px;
            background: var(--pixel-green);
            display: inline-block;
            animation: blink 0.6s steps(1) infinite;
            vertical-align: middle;
        }

        @keyframes blink { 50% { opacity: 0; } }

        input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--pixel-green);
            width: 100%;
            font-family: inherit;
        }

        #ai-quote {
            min-height: 2.5em;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="crt-monitor">
        <div class="scanline-effect"></div>
        
        <!-- UI Header -->
        <div class="flex justify-between border-b-2 border-[#00ff41] pb-2 mb-4 pixel-text text-sm">
            <div>
                <p>> SYS_CORE: V3.0_AI_ENHANCED</p>
                <p>> MODE: <span id="status-text">STANDBY</span></p>
            </div>
            <div class="text-right">
                <p id="current-date">DATE: 1999-01-01</p>
                <p>AI_ENGINE: GEMINI-2.5-FLASH</p>
            </div>
        </div>

        <!-- AI Task Input -->
        <div class="mb-4 pixel-border p-3 text-xs">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-white bg-[#00ff41] px-1 text-black font-bold">TASK_INPUT</span>
                <input id="task-input" type="text" placeholder="輸入目前的主要任務（例如：撰寫報告）..." maxlength="50">
                <button id="ai-split-btn" class="text-xs border border-[#00ff41] px-2 hover:bg-[#00ff41] hover:text-black transition-colors">✨ AI 拆解</button>
            </div>
            <div id="sub-tasks" class="grid grid-cols-2 gap-x-4 opacity-70">
                <!-- 子任務會顯示在這裡 -->
                <span>[ ] 待載入序列...</span>
                <span>[ ] 待載入序列...</span>
            </div>
        </div>

        <!-- Timer Center -->
        <div class="text-center my-6">
            <div id="ai-quote" class="text-xs mb-2 opacity-80 px-4">"系統就緒。等待專注指令..."</div>
            <div id="timer-display" class="text-7xl md:text-8xl font-bold pixel-text">25:00</div>
            <div id="timer-label" class="text-lg opacity-60 mt-1 font-bold tracking-widest">--- TASK_UNIT_25 ---</div>
        </div>

        <!-- Progress Matrix -->
        <div class="mb-6">
            <div class="flex justify-between text-xs mb-1">
                <span>BUFFERING_DATA_STREAM...</span>
                <span id="progress-percent">0%</span>
            </div>
            <div id="progress-matrix" class="flex flex-wrap gap-1 justify-center">
                <!-- Blocks generated by JS -->
            </div>
        </div>

        <!-- Commands -->
        <div class="flex justify-center gap-8 mb-6">
            <button id="start-btn" class="btn-pixel">RUN</button>
            <button id="reset-btn" class="btn-pixel" style="border-color: #880000; color: #ff0000; box-shadow: 4px 4px 0px #880000;">KILL</button>
        </div>

        <!-- Log Output -->
        <div class="bg-black p-3 pixel-border h-24 overflow-hidden text-xs opacity-90">
            <div id="logs" class="font-mono">
                <p>> 核心系統啟動成功...</p>
                <p>> 等待外部指令輸入 <span class="cursor"></span></p>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; // 由環境自動注入
        const WORK_TIME = 25 * 60;
        const BREAK_TIME = 5 * 60;
        const MATRIX_SIZE = 40; 

        let timeLeft = WORK_TIME;
        let isRunning = false;
        let isWorkSession = true;
        let timerId = null;

        const timerDisplay = document.getElementById('timer-display');
        const timerLabel = document.getElementById('timer-label');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusText = document.getElementById('status-text');
        const logsContainer = document.getElementById('logs');
        const progressMatrix = document.getElementById('progress-matrix');
        const progressPercent = document.getElementById('progress-percent');
        const aiQuoteDisplay = document.getElementById('ai-quote');
        const taskInput = document.getElementById('task-input');
        const subTasksContainer = document.getElementById('sub-tasks');
        const aiSplitBtn = document.getElementById('ai-split-btn');

        // 初始化進度方塊
        function initMatrix() {
            progressMatrix.innerHTML = '';
            for (let i = 0; i < MATRIX_SIZE; i++) {
                const block = document.createElement('div');
                block.className = 'progress-block';
                progressMatrix.appendChild(block);
            }
        }

        // --- Gemini API 集成 ---

        async function fetchGemini(prompt, systemInstruction) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('API_FAILURE');
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (err) {
                    if (i === 4) throw err;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        // ✨ 功能 1: 任務拆解
        async function splitTask() {
            const task = taskInput.value.trim();
            if (!task) {
                addLog("錯誤：未偵測到 TASK 內容。");
                return;
            }

            addLog("✨ AI 正在進行任務邏輯拆解...");
            subTasksContainer.innerHTML = '<span>[ ] 解析中...</span>';
            
            try {
                const systemPrompt = "你是一個效率終端機。請將使用者輸入的任務拆解為 4 個極短的步驟（每個步驟不超過 10 個字）。格式必須為：1.步驟 2.步驟 3.步驟 4.步驟。";
                const result = await fetchGemini(`任務：${task}`, systemPrompt);
                
                const steps = result.split(/[1-4]\./).filter(s => s.trim()).slice(0, 4);
                subTasksContainer.innerHTML = '';
                steps.forEach(step => {
                    const el = document.createElement('span');
                    el.textContent = `[ ] ${step.trim()}`;
                    subTasksContainer.appendChild(el);
                });
                addLog("✨ 任務拆解完成。序列已更新。");
            } catch (err) {
                addLog("✨ AI 拆解失敗。系統離線。");
                subTasksContainer.innerHTML = '<span>[ ] 序列手動加載模式</span>';
            }
        }

        // ✨ 功能 2: 隨機語錄
        async function updateQuote() {
            try {
                const systemPrompt = "你是一個冷酷的駭客終端機。請生成一句不超過 20 字的激勵語錄。風格要帶有復古電腦、代碼、矩陣感。例如：'燒錄你的意志，讓代碼跑得更快。'";
                const quote = await fetchGemini("給我一句隨機專注語錄", systemPrompt);
                aiQuoteDisplay.textContent = `"${quote.trim()}"`;
            } catch (err) {
                aiQuoteDisplay.textContent = '"代碼即真理，專注即力量。"';
            }
        }

        // --- 基礎邏輯 ---

        function playSound(freq, duration = 0.1) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        function addLog(msg) {
            const p = document.createElement('p');
            p.textContent = `> ${msg}`;
            logsContainer.appendChild(p);
            if (logsContainer.children.length > 5) logsContainer.removeChild(logsContainer.firstChild);
        }

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const secs = (timeLeft % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
            document.title = `${mins}:${secs} - AI_POMO`;

            const total = isWorkSession ? WORK_TIME : BREAK_TIME;
            const progressRatio = (total - timeLeft) / total;
            progressPercent.textContent = `${Math.floor(progressRatio * 100)}%`;

            const activeCount = Math.floor(progressRatio * MATRIX_SIZE);
            const blocks = document.querySelectorAll('.progress-block');
            blocks.forEach((b, idx) => {
                if (idx < activeCount) b.classList.add('active');
                else b.classList.remove('active');
            });
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                startBtn.textContent = 'RUN';
                statusText.textContent = 'PAUSED';
                addLog("進程暫停：等待喚醒。");
                playSound(300, 0.1);
            } else {
                isRunning = true;
                startBtn.textContent = 'STOP';
                statusText.textContent = isWorkSession ? 'EXECUTING' : 'RECOVERY';
                addLog(isWorkSession ? "執行專注指令集..." : "執行修眠指令集...");
                playSound(1000, 0.05);
                
                // 每次啟動時更新 AI 語錄
                updateQuote();

                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        isRunning = false;
                        startBtn.textContent = 'RUN';
                        switchSession();
                        toggleTimer();
                    }
                }, 1000);
            }
        }

        function switchSession() {
            isWorkSession = !isWorkSession;
            timeLeft = isWorkSession ? WORK_TIME : BREAK_TIME;
            timerLabel.textContent = isWorkSession ? '--- TASK_UNIT_25 ---' : '--- REST_UNIT_05 ---';
            
            if (isWorkSession) {
                addLog("✨ AI 正在重新評估狀態...");
                playSound(600, 0.3);
            } else {
                addLog("序列完成：啟動冷卻程序...");
                playSound(800, 0.3);
            }
            updateDisplay();
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            isWorkSession = true;
            timeLeft = WORK_TIME;
            timerLabel.textContent = '--- TASK_UNIT_25 ---';
            startBtn.textContent = 'RUN';
            statusText.textContent = 'STANDBY';
            addLog("核心清除：環境已還原。");
            playSound(150, 0.5);
            updateDisplay();
        }

        aiSplitBtn.addEventListener('click', splitTask);
        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);

        setInterval(() => {
            const now = new Date();
            document.getElementById('current-date').textContent = `DATE: ${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')}`;
        }, 1000);

        initMatrix();
        updateDisplay();
    </script>
</body>
</html>
