<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL_TERMINAL_V2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 引入像素風格字體 */
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&display=swap');

        :root {
            --pixel-green: #00ff41;
            --pixel-green-dim: #004411;
            --pixel-green-glow: rgba(0, 255, 65, 0.4);
            --bg-black: #050505;
        }

        body {
            background-color: #000;
            color: var(--pixel-green);
            font-family: 'DotGothic16', 'VT323', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        /* 模擬 CRT 螢幕與玻璃質感 */
        .crt-monitor {
            position: relative;
            width: 100%;
            max-width: 650px;
            background: #0a0a0a;
            border: 15px solid #2a2a2a;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 0 5px #1a1a1a, inset 0 0 100px rgba(0, 255, 65, 0.1);
        }

        /* 掃描線與顆粒感 */
        .crt-monitor::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 10;
            background-size: 100% 4px, 4px 100%;
            pointer-events: none;
            opacity: 0.7;
        }

        /* 螢幕抖動特效 */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline-effect {
            width: 100%;
            height: 100px;
            z-index: 11;
            background: linear-gradient(0deg, rgba(0, 255, 65, 0) 0%, rgba(0, 255, 65, 0.05) 50%, rgba(0, 255, 65, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
        }

        .pixel-text {
            text-shadow: 0 0 10px var(--pixel-green-glow);
            letter-spacing: 2px;
        }

        .btn-pixel {
            background: var(--pixel-green-dim);
            border: 3px solid var(--pixel-green);
            color: var(--pixel-green);
            padding: 10px 20px;
            font-size: 1.25rem;
            transition: all 0.1s;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--pixel-green);
            position: relative;
        }

        .btn-pixel:hover {
            background: var(--pixel-green);
            color: #000;
            box-shadow: 0px 0px 15px var(--pixel-green);
        }

        .btn-pixel:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--pixel-green);
        }

        .pixel-border {
            border: 2px solid var(--pixel-green);
            background: rgba(0, 255, 65, 0.05);
        }

        .progress-block {
            display: inline-block;
            width: 15px;
            height: 25px;
            margin-right: 2px;
            background: var(--pixel-green-dim);
        }

        .progress-block.active {
            background: var(--pixel-green);
            box-shadow: 0 0 8px var(--pixel-green);
        }

        .cursor {
            width: 12px;
            height: 20px;
            background: var(--pixel-green);
            display: inline-block;
            animation: blink 0.6s steps(1) infinite;
            vertical-align: middle;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="crt-monitor">
        <div class="scanline-effect"></div>
        
        <!-- UI Header -->
        <div class="flex justify-between border-b-2 border-[#00ff41] pb-2 mb-6 pixel-text">
            <div class="text-sm">
                <p>> SYS_CORE: LOADED</p>
                <p>> MODE: <span id="status-text">STANDBY</span></p>
            </div>
            <div class="text-right text-sm">
                <p id="current-date">DATE: 1999-01-01</p>
                <p>MEMORY: 640KB OK</p>
            </div>
        </div>

        <!-- Timer Center -->
        <div class="text-center my-10">
            <div id="timer-label" class="text-xl opacity-60 mb-2 font-bold tracking-widest">--- TASK_UNIT_25 ---</div>
            <div id="timer-display" class="text-8xl md:text-9xl font-bold pixel-text">25:00</div>
        </div>

        <!-- Progress Matrix -->
        <div class="mb-8">
            <div class="flex justify-between text-xs mb-2">
                <span>LOADING_RESOURCE...</span>
                <span id="progress-percent">0%</span>
            </div>
            <div id="progress-matrix" class="flex flex-wrap gap-1">
                <!-- Blocks generated by JS -->
            </div>
        </div>

        <!-- Commands -->
        <div class="flex justify-center gap-8 mb-10">
            <button id="start-btn" class="btn-pixel">RUN</button>
            <button id="reset-btn" class="btn-pixel" style="border-color: #880000; color: #ff0000; box-shadow: 4px 4px 0px #880000;">KILL</button>
        </div>

        <!-- Log Output -->
        <div class="bg-black p-4 pixel-border h-32 overflow-hidden text-sm opacity-90">
            <div id="logs" class="font-mono">
                <p>> 核心系統啟動成功...</p>
                <p>> 等待外部指令輸入 <span class="cursor"></span></p>
            </div>
        </div>
    </div>

    <script>
        const WORK_TIME = 25 * 60;
        const BREAK_TIME = 5 * 60;
        const MATRIX_SIZE = 20; // 顯示 20 個小方塊

        let timeLeft = WORK_TIME;
        let isRunning = false;
        let isWorkSession = true;
        let timerId = null;

        const timerDisplay = document.getElementById('timer-display');
        const timerLabel = document.getElementById('timer-label');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusText = document.getElementById('status-text');
        const logsContainer = document.getElementById('logs');
        const progressMatrix = document.getElementById('progress-matrix');
        const progressPercent = document.getElementById('progress-percent');
        const currentDateLabel = document.getElementById('current-date');

        // 初始化進度方塊
        function initMatrix() {
            progressMatrix.innerHTML = '';
            for (let i = 0; i < MATRIX_SIZE; i++) {
                const block = document.createElement('div');
                block.className = 'progress-block';
                progressMatrix.appendChild(block);
            }
        }

        function playSound(freq, duration = 0.1) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square'; // 像素風格適合方塊波
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        function addLog(msg) {
            const p = document.createElement('p');
            p.textContent = `> ${msg}`;
            logsContainer.appendChild(p);
            if (logsContainer.children.length > 5) logsContainer.removeChild(logsContainer.firstChild);
        }

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const secs = (timeLeft % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
            document.title = `${mins}:${secs} - PIXEL_POMO`;

            const total = isWorkSession ? WORK_TIME : BREAK_TIME;
            const progressRatio = (total - timeLeft) / total;
            progressPercent.textContent = `${Math.floor(progressRatio * 100)}%`;

            // 更新方塊
            const activeCount = Math.floor(progressRatio * MATRIX_SIZE);
            const blocks = document.querySelectorAll('.progress-block');
            blocks.forEach((b, idx) => {
                if (idx < activeCount) b.classList.add('active');
                else b.classList.remove('active');
            });
        }

        function switchSession() {
            isWorkSession = !isWorkSession;
            timeLeft = isWorkSession ? WORK_TIME : BREAK_TIME;
            timerLabel.textContent = isWorkSession ? '--- TASK_UNIT_25 ---' : '--- REST_UNIT_05 ---';
            statusText.textContent = isWorkSession ? 'EXECUTING' : 'RECOVERY';
            
            if (isWorkSession) {
                addLog("任務重啟：專注序列載入中...");
                playSound(600, 0.3);
            } else {
                addLog("序列完成：啟動冷卻程序...");
                playSound(800, 0.3);
            }
            updateDisplay();
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                startBtn.textContent = 'RUN';
                statusText.textContent = 'PAUSED';
                addLog("進程已中斷：等待喚醒指令。");
                playSound(300, 0.1);
            } else {
                isRunning = true;
                startBtn.textContent = 'STOP';
                statusText.textContent = isWorkSession ? 'EXECUTING' : 'RECOVERY';
                addLog(isWorkSession ? "執行專注指令集..." : "執行休眠指令集...");
                playSound(1000, 0.05);

                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        isRunning = false;
                        startBtn.textContent = 'RUN';
                        switchSession();
                        toggleTimer(); // 自動連鎖執行
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            isWorkSession = true;
            timeLeft = WORK_TIME;
            timerLabel.textContent = '--- TASK_UNIT_25 ---';
            startBtn.textContent = 'RUN';
            statusText.textContent = 'STANDBY';
            addLog("核心清除：環境已還原至預設值。");
            playSound(150, 0.5);
            updateDisplay();
        }

        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);

        // 模擬復古日期時鐘
        setInterval(() => {
            const now = new Date();
            currentDateLabel.textContent = `DATE: ${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')}`;
        }, 1000);

        initMatrix();
        updateDisplay();
    </script>
</body>
</html>
