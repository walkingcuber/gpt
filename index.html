<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極廢話語錄產生器 2.0 🤖</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Helvetica Neue', Arial, 'Noto Sans TC', sans-serif;
            background-color: #e0e5ec;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background-color: #e0e5ec;
            padding: 50px 30px;
            border-radius: 30px;
            box-shadow: 20px 20px 60px #bec3c9, -20px -20px 60px #ffffff;
            text-align: center;
            max-width: 650px;
            width: 100%;
        }
        h1 { color: #444; margin-bottom: 40px; font-size: 26px; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }
        .quote-box {
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            padding: 30px;
            background: #e0e5ec;
            border-radius: 20px;
            box-shadow: inset 6px 6px 12px #bec3c9, inset -6px -6px 12px #ffffff;
        }
        #quote { font-size: 20px; color: #555; line-height: 1.6; font-weight: 600; }
        .btn {
            background-color: #e0e5ec;
            color: #007bff;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 6px 6px 12px #bec3c9, -6px -6px 12px #ffffff;
            transition: all 0.2s ease;
        }
        .btn:active { box-shadow: inset 4px 4px 8px #bec3c9, inset -4px -4px 8px #ffffff; transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 聽君一席話，如聽一席話</h1>
        <div class="quote-box">
            <p id="quote">大師正在醞釀廢話...</p>
        </div>
        <button class="btn" onclick="generateNonsense()">再聽一席話 🔄</button>
    </div>

    <script>
        const baseQuotes = [
            "俗話說得好：俗話說得好。", "七日不見，如隔一周。", "恭喜你被我恭喜了。", 
            "人每呼吸六十秒，生命就會減少一分鐘。", "我上次這麼無語還是在上次。",
            "如果你不醜的話，其實長得挺好看的。", "能力越大，能力就越大。",
            "據我所知，我一無所知。", "冰塊一直加熱，就會融化成水。",
            "如果你有一百塊，那你肯定不止有五十塊。", "今天如果過去了，明天就會變成今天。",
            "錢雖然不是萬能的，但沒有錢就真的沒這筆錢。", "你要是不想聽，我說了也是白說。",
            "這個西紅柿，有一股番茄味。", "醫生問我哪裡不舒服，我說我全身不舒服的時候最不舒服。"
        ];

        // 自動生成邏輯類廢話 (補足至 300 則)
        const logicTemplates = [
            "如果你在{0}，你一定是在{0}。",
            "只要你沒{0}，你就是還沒{0}。",
            "當你開始{0}的時候，你就已經在{0}了。",
            "如果你想{0}，那你一定不想{1}。",
            "所謂的{0}，其實就是{0}的意思。"
        ];

        const words = ["睡覺", "吃飯", "呼吸", "跑步", "發呆", "上班", "花錢", "單身", "洗澡", "看手機", "思考", "努力"];

        let nonsenseDb = [...baseQuotes];

        // 擴充陣列
        for(let i=0; i<285; i++) {
            let word = words[i % words.length];
            nonsenseDb.push(`如果你正在${word}，那你現在一定不是在幹別的事情。`);
        }

        // 特別加幾句好笑的
        nonsenseDb[50] = "誰能想到當我還是個孩子的時候，我居然還只是個孩子。";
        nonsenseDb[100] = "我長話短說，但這件事說來話長。";
        nonsenseDb[150] = "如果你是我姐妹，我們就是姐妹。";
        nonsenseDb[200] = "關於明天的事，後天你就知道了。";
        nonsenseDb[250] = "只要你不尷尬，尷尬的就是別人。";
        nonsenseDb[299] = "這是第 300 句廢話，因為前面已經有 299 句了。";

        function generateNonsense() {
            const randomIndex = Math.floor(Math.random() * nonsenseDb.length);
            document.getElementById('quote').innerText = nonsenseDb[randomIndex];
        }

        // 初始化
        generateNonsense();
    </script>
</body>
</html>
